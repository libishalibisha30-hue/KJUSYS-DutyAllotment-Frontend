<section class="min-h-full bg-[#fafafd] px-[24px] pt-[28px] pb-[80px]">

  <!-- Page Header -->
  <div class="flex items-center justify-between mb-[20px]">
    <h2 class="text-[14px] font-semibold text-gray-700">Faculty Management</h2>
    <button
      (click)="openAddFaculty()"
      class="flex items-center gap-[6px] bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-[13px] font-semibold px-[16px] py-[8px] rounded-[6px] transition-colors duration-150 shadow-sm">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
      </svg>
      Add Faculty
    </button>
  </div>

  <!-- Search + Filter Bar -->
  <div class="flex items-center justify-between gap-[12px] mb-[16px]">
    <!-- Search -->
    <div class="relative flex-grow max-w-[380px]">
      <svg class="absolute left-[10px] top-1/2 -translate-y-1/2 w-[14px] h-[14px] text-gray-400 pointer-events-none"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="7"/>
        <path stroke-linecap="round" d="M20 20l-3-3"/>
      </svg>
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearch()"
        placeholder="Search Faculty..."
        class="w-full pl-[32px] pr-[12px] py-[8px] border border-gray-200 rounded-[6px] text-[12px] text-gray-700 bg-white placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-400 transition"/>
    </div>

    <!-- Filters button -->
    <button class="flex items-center gap-[6px] border border-gray-200 bg-white hover:bg-gray-50 text-gray-600 text-[12px] font-medium px-[14px] py-[8px] rounded-[6px] transition-colors duration-150">
      <svg class="w-[14px] h-[14px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 4h18M7 10h10M11 16h2"/>
      </svg>
      Filters
    </button>
  </div>

  <!-- Table Card -->
  <div class="bg-white border border-gray-200 rounded-[8px] shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <!-- Head -->
        <thead>
          <tr class="border-b border-gray-100 bg-gray-50/50">
            <!-- Checkbox all -->
            <th class="pl-[20px] pr-[8px] py-[11px] w-[40px]">
              <input
                type="checkbox"
                [checked]="allSelected"
                (change)="toggleSelectAll($event)"
                class="w-[14px] h-[14px] rounded border-gray-300 accent-blue-600 cursor-pointer"/>
            </th>
            <th class="px-[12px] py-[11px] text-[10px] font-bold text-gray-400 uppercase tracking-wider whitespace-nowrap">Emp ID</th>
            <th class="px-[12px] py-[11px] text-[10px] font-bold text-gray-400 uppercase tracking-wider whitespace-nowrap">Faculty Name</th>
            <th class="px-[12px] py-[11px] text-[10px] font-bold text-gray-400 uppercase tracking-wider whitespace-nowrap">Department</th>
            <th class="px-[12px] py-[11px] text-[10px] font-bold text-gray-400 uppercase tracking-wider whitespace-nowrap">Designation</th>
            <th class="px-[12px] py-[11px] text-[10px] font-bold text-gray-400 uppercase tracking-wider whitespace-nowrap">Status</th>
            <th class="px-[12px] py-[11px] text-[10px] font-bold text-gray-400 uppercase tracking-wider whitespace-nowrap text-center">Actions</th>
          </tr>
        </thead>

        <!-- Body -->
        <tbody>
          <tr
            *ngFor="let faculty of pagedFaculty"
            class="border-b border-gray-50 last:border-b-0 hover:bg-gray-50/40 transition-colors duration-100">

            <!-- Checkbox -->
            <td class="pl-[20px] pr-[8px] py-[12px]">
              <input
                type="checkbox"
                [(ngModel)]="faculty.selected"
                class="w-[14px] h-[14px] rounded border-gray-300 accent-blue-600 cursor-pointer"/>
            </td>

            <!-- Emp ID -->
            <td class="px-[12px] py-[12px] text-[12px] font-medium text-gray-700 whitespace-nowrap">{{ faculty.empId }}</td>

            <!-- Faculty Name -->
            <td class="px-[12px] py-[12px] text-[12px] text-gray-700 whitespace-nowrap">{{ faculty.facultyName }}</td>

            <!-- Department -->
            <td class="px-[12px] py-[12px] text-[12px] text-gray-700 whitespace-nowrap">{{ faculty.department }}</td>

            <!-- Designation -->
            <td class="px-[12px] py-[12px] text-[12px] text-gray-700 whitespace-nowrap">{{ faculty.designation }}</td>

            <!-- Status badge -->
            <td class="px-[12px] py-[12px] whitespace-nowrap">
              <span [ngClass]="{
                'text-[#10b981]': faculty.status === 'Active',
                'text-[#f59e0b]': faculty.status === 'On Leave',
                'text-[#ef4444]': faculty.status === 'Inactive'
              }" class="text-[12px] font-semibold">
                {{ faculty.status }}
              </span>
            </td>

            <!-- Actions -->
            <td class="px-[12px] py-[12px] whitespace-nowrap">
              <div class="flex items-center justify-center gap-[10px]">
                <!-- View -->
                <button title="View" (click)="viewFaculty(faculty)" class="text-gray-400 hover:text-blue-500 transition-colors">
                  <svg class="w-[15px] h-[15px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  </svg>
                </button>
                <!-- Edit -->
                <button title="Edit" (click)="editFaculty(faculty)" class="text-gray-400 hover:text-green-500 transition-colors">
                  <svg class="w-[15px] h-[15px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                  </svg>
                </button>
                <!-- Delete -->
                <button title="Delete" (click)="deleteFaculty(faculty)" class="text-gray-400 hover:text-red-500 transition-colors">
                  <svg class="w-[15px] h-[15px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 11v6M14 11v6"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
                  </svg>
                </button>
                <!-- More -->
                <button title="More" class="text-gray-400 hover:text-gray-600 transition-colors">
                  <svg class="w-[15px] h-[15px]" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
                  </svg>
                </button>
              </div>
            </td>
          </tr>

          <!-- Empty state -->
          <tr *ngIf="pagedFaculty.length === 0">
            <td colspan="7" class="px-[24px] py-[40px] text-center text-[13px] text-gray-400">
              No faculty found.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination Footer -->
    <div class="px-[20px] py-[12px] border-t border-gray-100 flex items-center justify-between flex-wrap gap-3">

      <!-- Rows per page -->
      <div class="flex items-center gap-[8px] text-[12px] text-gray-500">
        <span>Rows per page</span>
        <div class="relative">
          <select
            [(ngModel)]="rowsPerPage"
            (ngModelChange)="onRowsPerPageChange()"
            class="appearance-none border border-gray-200 rounded-[4px] px-[8px] pr-[20px] py-[3px] text-[12px] text-gray-700 bg-white cursor-pointer focus:outline-none focus:ring-1 focus:ring-blue-400">
            <option [value]="5">5</option>
            <option [value]="10">10</option>
            <option [value]="20">20</option>
            <option [value]="50">50</option>
          </select>
          <svg class="pointer-events-none absolute right-[4px] top-1/2 -translate-y-1/2 w-3 h-3 text-gray-500"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
          </svg>
        </div>
      </div>

      <!-- Range + page buttons -->
      <div class="flex items-center gap-[12px]">
        <span class="text-[12px] text-gray-500">{{ rangeStart }} – {{ rangeEnd }} of {{ totalItems }}</span>

        <!-- Prev -->
        <button
          (click)="prevPage()"
          [disabled]="currentPage === 1"
          class="w-[28px] h-[28px] flex items-center justify-center rounded-[4px] border border-gray-200 bg-white hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
          <svg class="w-3.5 h-3.5 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/>
          </svg>
        </button>

        <!-- Page numbers -->
        <div class="flex items-center gap-[4px]">
          <button
            *ngFor="let p of visiblePages"
            (click)="goToPage(p)"
            [ngClass]="{
              'bg-blue-600 text-white border-blue-600': p === currentPage,
              'bg-white text-gray-600 border-gray-200 hover:bg-gray-50': p !== currentPage
            }"
            class="w-[28px] h-[28px] flex items-center justify-center rounded-[4px] border text-[12px] font-medium transition-colors">
            {{ p }}
          </button>
        </div>

        <!-- Next -->
        <button
          (click)="nextPage()"
          [disabled]="currentPage === totalPages"
          class="w-[28px] h-[28px] flex items-center justify-center rounded-[4px] border border-gray-200 bg-white hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
          <svg class="w-3.5 h-3.5 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

</section>
