<section class="min-h-full bg-[#fafafd] px-[24px] pt-[20px] pb-[80px] font-sans">

  <!-- Outer container constrained to a maximum width to match Figma -->
  <div class="max-w-[730px] w-full">

    <!-- Search, Filter and Actions Toolbar -->
    <div class="flex items-center justify-between gap-4 mb-[16px]">

      <!-- Search Bar (Left) -->
      <div class="relative w-[180px] sm:w-[220px]">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
          <!-- Magnifying Glass Icon -->
          <svg class="w-3.5 h-3.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </span>
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearch()"
          placeholder="Search Faculty..."
          class="w-full pl-8 pr-3 py-[7px] text-[11px] text-gray-700 bg-white border border-gray-200 rounded-[6px] placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm"
        />
      </div>

      <!-- Filters & Actions (Right) -->
      <div class="flex items-center gap-[10px] ml-auto">

        <!-- Timeframe Pills -->
        <div class="flex items-center gap-[10px] text-[10px] font-bold text-gray-400 mr-[8px]">
          <button
            *ngFor="let tf of timeframes"
            (click)="setTimeframe(tf)"
            [ngClass]="{
              'text-[#005faa] border-b-[2px] border-[#005faa] pb-[1px] font-extrabold': tf === activeTimeframe,
              'hover:text-gray-600': tf !== activeTimeframe
            }"
            class="transition-all uppercase py-[2px] px-[2px] focus:outline-none"
          >
            {{ tf }}
          </button>
        </div>

        <!-- Date Range Button -->
        <button class="flex items-center gap-1.5 px-[10px] py-[7px] text-[11px] font-semibold text-gray-600 bg-white border border-gray-200 rounded-[6px] hover:bg-gray-50 active:bg-gray-100 transition shadow-sm focus:outline-none">
          <!-- Calendar Icon -->
          <svg class="w-3.5 h-3.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <span>Date Range</span>
        </button>

        <!-- Filters Button -->
        <button class="flex items-center gap-1.5 px-[10px] py-[7px] text-[11px] font-semibold text-gray-600 bg-white border border-gray-200 rounded-[6px] hover:bg-gray-50 active:bg-gray-100 transition shadow-sm focus:outline-none">
          <!-- Filter Icon -->
          <svg class="w-3.5 h-3.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 4h18M7 10h10M11 16h2" />
          </svg>
          <span>Filters</span>
        </button>

        <!-- Export Button -->
        <button (click)="exportRecords()" class="flex items-center gap-1.5 px-[12px] py-[7px] text-[11px] font-semibold text-white bg-[#005faa] hover:bg-[#004b87] active:bg-[#003d70] rounded-[6px] transition shadow-sm focus:outline-none">
          <!-- Export/Download Icon -->
          <svg class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          <span>Export</span>
        </button>

      </div>
    </div>

    <!-- Table Card -->
    <div class="bg-white border border-gray-200 rounded-[8px] shadow-sm overflow-hidden mb-[16px]">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-white border-b border-gray-200">
              <th class="px-[20px] py-[12px] text-[9px] font-bold text-gray-400 uppercase tracking-wider">Faculty Name</th>
              <th class="px-[20px] py-[12px] text-[9px] font-bold text-gray-400 uppercase tracking-wider">Duty Type</th>
              <th class="px-[20px] py-[12px] text-[9px] font-bold text-gray-400 uppercase tracking-wider">Date</th>
              <th class="px-[20px] py-[12px] text-[9px] font-bold text-gray-400 uppercase tracking-wider">Event</th>
              <th class="px-[20px] py-[12px] text-[9px] font-bold text-gray-400 uppercase tracking-wider">Status</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100">
            <tr *ngFor="let record of pagedRecords" class="hover:bg-gray-50/40 transition-colors duration-100">
              <!-- Faculty Name -->
              <td class="px-[20px] py-[14px] text-[11px] font-semibold text-gray-700 whitespace-nowrap">
                {{ record.facultyName }}
              </td>
              <!-- Duty Type -->
              <td class="px-[20px] py-[14px] text-[11px] font-semibold text-gray-700 whitespace-nowrap">
                {{ record.dutyType }}
              </td>
              <!-- Date -->
              <td class="px-[20px] py-[14px] text-[11px] font-semibold text-gray-700 whitespace-nowrap">
                {{ record.date }}
              </td>
              <!-- Event -->
              <td class="px-[20px] py-[14px] text-[11px] font-semibold text-gray-700 whitespace-nowrap">
                {{ record.event }}
              </td>
              <!-- Status Badge -->
              <td class="px-[20px] py-[14px] whitespace-nowrap">
                <span [ngClass]="{
                  'text-[#005faa] bg-[#005faa]/10': record.status === 'Completed',
                  'text-[#ef4444] bg-[#ef4444]/10': record.status === 'Cancelled',
                  'text-[#d97706] bg-[#d97706]/10': record.status === 'Pending' || record.status === 'Assigned'
                }" class="inline-flex items-center justify-center rounded-[4px] px-[10px] py-[4px] text-[10px] font-bold min-w-[76px] text-center">
                  {{ record.status }}
                </span>
              </td>
            </tr>

            <!-- Empty State -->
            <tr *ngIf="pagedRecords.length === 0">
              <td colspan="5" class="px-[20px] py-[40px] text-center text-[12px] text-gray-400 font-medium">
                No duty records found.
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination Footer -->
      <div class="px-[20px] py-[12px] border-t border-gray-200 flex items-center justify-between flex-wrap gap-4 bg-white">

        <!-- Rows per page selection -->
        <div class="flex items-center gap-[6px] text-[11px] text-gray-400 font-medium">
          <span>Rows per page</span>
          <div class="relative">
            <select
              [(ngModel)]="rowsPerPage"
              (ngModelChange)="onRowsPerPageChange()"
              class="appearance-none border border-gray-200 bg-white rounded-[4px] pl-[6px] pr-[18px] py-[2px] text-[11px] font-semibold text-gray-700 cursor-pointer focus:outline-none"
            >
              <option [value]="5">5</option>
              <option [value]="10">10</option>
              <option [value]="20">20</option>
              <option [value]="50">50</option>
            </select>
            <svg class="pointer-events-none absolute right-[5px] top-1/2 -translate-y-1/2 w-3 h-3 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
        </div>

        <!-- Range + Pagination Controls -->
        <div class="flex items-center gap-[14px] text-[11px] text-gray-400 font-medium">
          <span>{{ rangeStart }} - {{ rangeEnd }} of {{ totalItems }}</span>

          <div class="flex items-center gap-[8px]">
            <!-- Prev Arrow -->
            <button
              (click)="prevPage()"
              [disabled]="currentPage === 1"
              class="text-gray-400 hover:text-gray-700 disabled:opacity-30 disabled:cursor-not-allowed p-[2px] transition-colors focus:outline-none"
            >
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
              </svg>
            </button>

            <!-- Page Numbers -->
            <div class="flex items-center gap-[6px]">
              <button
                *ngFor="let p of visiblePages"
                (click)="goToPage(p)"
                [ngClass]="{
                  'bg-[#005faa] text-white w-[22px] h-[22px] flex items-center justify-center rounded-full font-bold': p === currentPage,
                  'text-gray-500 hover:text-gray-800 font-semibold px-[4px] py-[2px]': p !== currentPage
                }"
                class="text-[11px] transition-all focus:outline-none"
              >
                {{ p }}
              </button>
            </div>

            <!-- Next Arrow -->
            <button
              (click)="nextPage()"
              [disabled]="currentPage === totalPages"
              class="text-gray-400 hover:text-gray-700 disabled:opacity-30 disabled:cursor-not-allowed p-[2px] transition-colors focus:outline-none"
            >
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
              </svg>
            </button>
          </div>

        </div>

      </div>
    </div>

  </div>

</section>
