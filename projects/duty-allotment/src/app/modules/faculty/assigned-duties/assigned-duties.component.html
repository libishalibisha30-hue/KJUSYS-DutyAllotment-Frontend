<section class="min-h-full bg-[#fafafd] px-[24px] pt-[28px] pb-[80px]">

  <!-- Sub-tabs and Search Bar -->
  <div class="flex flex-col md:flex-row md:items-end justify-between border-b border-gray-200 mb-[28px] gap-4">
    
    <!-- Sub-tabs -->
    <div class="flex items-center gap-[12px] -mb-[1px]">
      <button 
        (click)="selectSubTab('today')"
        class="px-[16px] pb-[12px] pt-[8px] text-[15px] font-semibold transition-all border-b-2 focus:outline-none rounded-t-[6px]"
        [ngClass]="activeSubTab === 'today' ? 'text-blue-600 bg-blue-50 border-blue-600 font-bold' : 'text-gray-400 border-transparent hover:text-gray-600 hover:bg-gray-50'">
        Today's Duties
      </button>
      <button 
        (click)="selectSubTab('upcoming')"
        class="px-[16px] pb-[12px] pt-[8px] text-[15px] font-semibold transition-all border-b-2 focus:outline-none rounded-t-[6px]"
        [ngClass]="activeSubTab === 'upcoming' ? 'text-blue-600 bg-blue-50 border-blue-600 font-bold' : 'text-gray-400 border-transparent hover:text-gray-600 hover:bg-gray-50'">
        Upcoming Duties
      </button>
    </div>

    <!-- Search Bar -->
    <div class="relative w-full md:w-[280px] pb-[12px]">
      <span class="absolute inset-y-0 left-0 pl-[12px] pb-[12px] flex items-center pointer-events-none">
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="8" />
          <path d="M21 21l-4.3-4.3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <input 
        type="text" 
        (input)="onSearch($event)"
        placeholder="Search configuration..." 
        class="w-full pl-[36px] pr-[16px] py-[8px] bg-white border border-gray-300 rounded-[6px] text-[13px] text-gray-700 placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" />
    </div>

  </div>

  <!-- Duties List -->
  <div class="flex flex-col gap-[16px]">
    
    <!-- Render each duty -->
    <div 
      *ngFor="let duty of filteredDuties" 
      class="bg-white border border-gray-200 rounded-[8px] shadow-sm px-[24px] py-[20px] flex flex-col lg:flex-row lg:items-center justify-between gap-6 hover:shadow-md transition-shadow duration-200">
      
      <!-- Duty Type & Icon -->
      <div class="flex items-center gap-[16px] w-full lg:w-[22%]">
        <div class="w-[44px] h-[44px] bg-[#f9fafb] border border-gray-100 rounded-[8px] flex items-center justify-center text-gray-600">
          
          <!-- Exam Duty Icon (Clipboard-Edit) -->
          <svg *ngIf="duty.type === 'Exam Duty'" class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
          
          <!-- Interview Duty Icon (File-Text) -->
          <svg *ngIf="duty.type !== 'Exam Duty'" class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          
        </div>
        <h4 class="text-[16px] font-bold text-gray-900">{{ duty.type }}</h4>
      </div>

      <!-- Date / Time -->
      <div class="flex items-start gap-[12px] w-full lg:w-[26%]">
        <div class="text-gray-400 mt-[3px]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="4" width="18" height="17" rx="2" stroke="currentColor" stroke-width="2" />
            <path d="M3 9H21" stroke="currentColor" stroke-width="2" />
            <path d="M8 2V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path d="M16 2V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="text-[12px] font-medium text-gray-400">Date/time</span>
          <span class="text-[14px] font-semibold text-gray-800 mt-[2px]">{{ duty.date }}</span>
          <span class="text-[13px] text-gray-500 mt-[1px]">{{ duty.time }}</span>
        </div>
      </div>

      <!-- Location -->
      <div class="flex items-start gap-[12px] w-full lg:w-[22%]">
        <div class="text-gray-400 mt-[3px]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="text-[12px] font-medium text-gray-400">Location</span>
          <span class="text-[14px] font-semibold text-gray-800 mt-[2px]">{{ duty.locationBuilding }}</span>
          <span class="text-[13px] text-gray-500 mt-[1px]">{{ duty.locationRoom }}</span>
        </div>
      </div>

      <!-- Assigned By -->
      <div class="flex items-start gap-[12px] w-full lg:w-[22%]">
        <div class="text-gray-400 mt-[3px]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="text-[12px] font-medium text-gray-400">Assigned By</span>
          <span class="text-[14px] font-semibold text-gray-800 mt-[2px]">{{ duty.assignedBy }}</span>
        </div>
      </div>

      <!-- Status Pill -->
      <div class="flex items-center lg:justify-end w-full lg:w-[8%]">
        <span class="px-[16px] py-[6px] bg-[#eff6ff] text-[#1e40af] text-[13px] font-semibold rounded-[20px] text-center shadow-sm">
          {{ duty.status }}
        </span>
      </div>

    </div>

    <!-- Empty State -->
    <div *ngIf="filteredDuties.length === 0" class="bg-white border border-gray-200 rounded-[8px] shadow-sm py-[40px] text-center text-gray-500">
      No duties found for the selected view.
    </div>

  </div>

</section>
