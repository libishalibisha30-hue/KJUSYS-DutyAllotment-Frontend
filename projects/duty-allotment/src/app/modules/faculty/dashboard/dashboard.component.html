<section class="min-h-full bg-[#fafafd] px-[24px] pt-[28px] pb-[80px]">

  <!-- Dashboard Cards -->
  <div class="flex flex-wrap items-start gap-[24px] md:gap-[36px]">

    <!-- Assigned Duties -->
    <div
      class="w-[300px] h-[160px] bg-white border border-gray-200 rounded-[8px] shadow-sm px-[20px] py-[18px] flex flex-col justify-between hover:shadow-md transition-shadow duration-200">
      <div class="flex items-start justify-between">
        <h3 class="text-[15px] font-semibold text-gray-800 leading-tight">
          Assigned Duties
        </h3>
        <div class="flex-shrink-0">
          <svg class="w-7 h-7 text-gray-800" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="4" width="18" height="17" rx="2" stroke="currentColor" stroke-width="2" />
            <path d="M3 9H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path d="M7 2v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path d="M17 2v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <circle cx="7" cy="13" r="1" fill="currentColor" />
            <circle cx="12" cy="13" r="1" fill="currentColor" />
            <circle cx="17" cy="13" r="1" fill="currentColor" />
            <circle cx="7" cy="17" r="1" fill="currentColor" />
            <circle cx="12" cy="17" r="1" fill="currentColor" />
            <circle cx="17" cy="17" r="1" fill="currentColor" />
          </svg>
        </div>
      </div>
      <div class="flex-grow flex items-center justify-center">
        <span class="text-[42px] font-bold text-gray-900 leading-none">00</span>
      </div>
    </div>

    <!-- Upcoming Duties -->
    <div
      class="w-[300px] h-[160px] bg-white border border-gray-200 rounded-[8px] shadow-sm px-[20px] py-[18px] flex flex-col justify-between hover:shadow-md transition-shadow duration-200">
      <div class="flex items-start justify-between">
        <h3 class="text-[15px] font-semibold text-gray-800 leading-tight">
          Upcoming Duties
        </h3>
        <div class="flex-shrink-0">
          <svg class="w-7 h-7 text-gray-800" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" />
            <path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
      </div>
      <div class="flex-grow flex items-center justify-center">
        <span class="text-[42px] font-bold text-gray-900 leading-none">00</span>
      </div>
    </div>

    <!-- Swap Request -->
    <div
      class="w-[300px] h-[160px] bg-white border border-gray-200 rounded-[8px] shadow-sm px-[20px] py-[18px] flex flex-col justify-between hover:shadow-md transition-shadow duration-200">
      <div class="flex items-start justify-between">
        <h3 class="text-[15px] font-semibold text-gray-800 leading-tight">
          Swap Request
        </h3>
        <div class="flex-shrink-0">
          <svg class="w-7 h-7 text-gray-800" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 8h16M16 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M20 16H4M8 12l-4 4 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
      </div>
      <div class="flex-grow flex items-center justify-center">
        <span class="text-[42px] font-bold text-gray-900 leading-none">00</span>
      </div>
    </div>

  </div>

  <!-- Calendar Card -->
  <div class="mt-[40px] w-[300px] bg-white border border-gray-200 rounded-[8px] shadow-sm px-[24px] py-[20px] hover:shadow-md transition-shadow duration-200 relative">

    <!-- Month + Nav -->
    <div class="flex items-center justify-between mb-[20px]">
      <h2 class="text-[15px] font-bold text-gray-800">{{ monthLabel }}</h2>
      <div class="flex items-center gap-[12px] text-gray-600">
        <button
          (click)="prevMonth()"
          class="hover:text-blue-600 transition-colors text-[20px] font-bold leading-none p-1 rounded hover:bg-gray-100">‹</button>
        <button
          (click)="nextMonth()"
          class="hover:text-blue-600 transition-colors text-[20px] font-bold leading-none p-1 rounded hover:bg-gray-100">›</button>
      </div>
    </div>

    <!-- Day headers -->
    <div class="grid grid-cols-7 text-[12px] font-semibold text-gray-400 text-center mb-[12px]">
      <span *ngFor="let h of dayHeaders">{{ h }}</span>
    </div>

    <!-- Date grid -->
    <div class="grid grid-cols-7 gap-y-[6px] text-[13px] text-center text-gray-700">
      <ng-container *ngFor="let week of calendarWeeks">
        <span
          *ngFor="let day of week"
          class="flex flex-col items-center justify-center w-9 h-9"
          [class.cursor-pointer]="!!day.day"
          (click)="onDayClick(day)">

          <!-- Empty cell -->
          <ng-container *ngIf="!day.day"></ng-container>

          <!-- Today (not selected) — outline ring only, NOT filled -->
          <span
            *ngIf="day.day && day.isToday && !day.isSelected"
            class="w-8 h-8 flex flex-col items-center justify-center rounded-full ring-2 ring-blue-500 text-blue-600 font-bold cursor-pointer select-none hover:bg-blue-50 transition-colors duration-150">
            <span>{{ day.day }}</span>
            <span *ngIf="day.hasDuty" class="w-1 h-1 rounded-full bg-orange-400 mt-[1px]"></span>
          </span>

          <!-- Selected (any day including today) — filled blue -->
          <span
            *ngIf="day.day && day.isSelected"
            class="w-8 h-8 flex flex-col items-center justify-center bg-blue-600 text-white rounded-full font-semibold cursor-pointer select-none shadow-sm transition-colors duration-150">
            <span>{{ day.day }}</span>
            <span *ngIf="day.hasDuty" class="w-1 h-1 rounded-full bg-orange-300 mt-[1px]"></span>
          </span>

          <!-- Normal day -->
          <span
            *ngIf="day.day && !day.isToday && !day.isSelected"
            class="w-8 h-8 flex flex-col items-center justify-center font-medium rounded-full hover:bg-gray-100 cursor-pointer transition-colors duration-150 select-none">
            <span>{{ day.day }}</span>
            <span *ngIf="day.hasDuty" class="w-1 h-1 rounded-full bg-orange-400 mt-[1px]"></span>
          </span>

        </span>
      </ng-container>
    </div>

  </div>

</section>
